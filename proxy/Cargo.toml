[package]
name = "agent-sandbox-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
ipnet = "2.9.0"
rcgen = "0.13.1"
rustls = { version = "0.23.12", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.1.2"
rustls-pki-types = "1.8.0"
webpki-roots = "0.26.6"
crossterm = "0.27"
ratatui = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.4"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "agent-sandbox-tui"
path = "src/tui.rs"

[[bin]]
name = "agent-sandbox-proxy"
path = "src/main.rs"

[[bin]]
name = "relay-server"
path = "src/relay_server.rs"

[[bin]]
name = "relay-gpg"
path = "src/relay_gpg.rs"

[[bin]]
name = "relay-ssh"
path = "src/relay_ssh.rs"
